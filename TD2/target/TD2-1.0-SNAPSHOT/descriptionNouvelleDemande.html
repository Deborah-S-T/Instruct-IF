<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Description — Instruct-IF</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/instruct-if.css">
    </head>
    <body>
        <div data-main>
            <h1 class="page-title">Description de la demande</h1>
            <p class="page-subtitle">Précisez votre besoin de soutien</p>

            <section class="card">
                <ul class="info-list">
                    <li><span class="label">Matière</span><span class="value" id="li-matiere">—</span></li>
                    <li><span class="label">Thème</span><span class="value" id="li-theme">—</span></li>
                </ul>
                <div class="form-group">
                    <label for="textarea-description">Description</label>
                    <textarea id="textarea-description" placeholder="Ex. : je n'ai pas compris l'ordre seigneurial…"></textarea>
                </div>
                <button id="button-valider" class="btn btn-primary" type="button">Valider la demande</button>
            </section>
        </div>

        <script src="js/layout.js"></script>
 
        <script>
            function initPage() {
                console.log("Initialisation de la page Nouvelle demande");
                
                renderHeader({ links: [{ href: 'nouvelleDemande.html', label: 'Retour' }] });

                const params = new URLSearchParams(window.location.search); 
                let themeId = params.get("theme");
                
                recupThemeMatiere(themeId);
                document.getElementById('button-valider').addEventListener('click', function() {
                    console.log("Click sur le bouton 'Valider demande'");
                    creerDemande(themeId);
                });
                document.getElementById('button-logOut').addEventListener('click', function() {
                    console.log("Click sur le bouton 'log out'");
                    logOut();
                });
            };
            
            async function recupThemeMatiere(theme) {
                console.log("Appel de l'Action: recupThemeMatiere");
                
                let url = './ActionServlet?todo=recup-theme-matiere' + "&theme=" + theme;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                if (jsonResponse) {
                    let matiere = document.getElementById("li-matiere");
                    let theme = document.getElementById("li-theme");

                    matiere.textContent = jsonResponse["matiereNom"];
                    theme.textContent = jsonResponse["themeNom"];
                }
            }
            
            async function creerDemande(theme) {
                console.log("Appel de l'Action: creer Demande");
                let description = document.getElementById("textarea-description").value;
                let url = './ActionServlet?todo=creer-demande'+ "&theme=" + theme + "&description=" + description;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                if (jsonResponse) {
                    window.location = './etatDemande.html' + "?reussit=" + jsonResponse.reussit + "&idDemande=" + jsonResponse.idDemande + "&lienDemande=" + jsonResponse.lienDemande + "&theme=" + theme + "&description=" + description;
                }
            }
            
            async function logOut() {
                console.log("Appel de l'Action: log out");
                let url = './ActionServlet?todo=log-out';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse.reussit == "true") {
                    console.log('logged out');
                    window.location = "./connexion.html";
                }
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>

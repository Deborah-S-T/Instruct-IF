<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Profil — Instruct-IF</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/instruct-if.css">
    </head>
    <body>
        <div data-main>
            <h1 class="page-title" id="h1-titre">Profil</h1>
            <p class="page-subtitle" id="page-subtitle"></p>

            <div class="toolbar" id="toolbar-actions"></div>
            <section class="card">
                <ul class="info-list" id="ul-infos"></ul>
                <div id="historique-zone"></div>
            </section>
        </div>

        <script src="js/layout.js"></script>
        <script>
            function initPage() {
                console.log("Initialisation de la page Profil");
                
                const params = new URLSearchParams(window.location.search); 
                isIntervenant = params.get('intervenant') === 'true';
                isEleveProfil = params.get('eleve') === 'true';
                var idEleve = params.get('idEleve');

                if (isEleveProfil && idEleve !== 'null') {
                    document.getElementById('h1-titre').textContent = 'Profil élève';
                    document.getElementById('page-subtitle').textContent = 'Informations de l\'élève accompagné';
                    mettreProfilEleve(idEleve);
                    renderHeader({
                        links: [
                            { href: 'intervention.html', label: 'Intervention' },
                            { href: 'stats.html', label: 'Statistiques' }
                        ]
                    });
                } else if (isIntervenant) {
                    document.getElementById('page-subtitle').textContent = 'Vos interventions et historique';
                    mettreProfilIntervenant();
                    renderHeader({
                        links: [
                            { href: 'intervention.html', label: 'Intervention' },
                            { href: 'stats.html', label: 'Statistiques' }
                        ]
                    });
                    var tb = document.getElementById('toolbar-actions');
                    tb.innerHTML = '<a href="stats.html" class="btn btn-primary">Voir les statistiques</a>';
                } else {
                    document.getElementById('page-subtitle').textContent = 'Votre espace élève';
                    mettreProfilEleve('null');
                    renderHeader({ links: [{ href: 'nouvelleDemande.html', label: 'Nouvelle demande' }] });
                }
            };

            function ajouterLogOut(ul) {
                var tb = document.getElementById('toolbar-actions');
                var btn = document.createElement('button');
                btn.className = 'btn btn-danger';
                btn.textContent = 'Déconnexion';
                btn.onclick = logOut;
                tb.appendChild(btn);
            }
            
            async function mettreProfilEleve(idEleve) {
                console.log("Appel de l'Action: mettreProfilEleve");
                let url = './ActionServlet?todo=mettre-profil' + "&id=" + idEleve;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                let ul = document.getElementById("ul-infos");
                
                if (idEleve == "null") {
                    
                    ajouterLogOut(ul);
                    ul.innerHTML += '<li><span class="label">Nom</span><span class="value">' + jsonResponse.nom + '</span></li>';
                    ul.innerHTML += '<li><span class="label">Prénom</span><span class="value">' + jsonResponse.prenom + '</span></li>';
                    afficherHistorique(jsonResponse.histoDemandes, 'eleve');

                }
                else {
                    
                    ul.innerHTML += '<li><span class="label">Date de naissance</span><span class="value">' + jsonResponse.dateNaissance + '</span></li>';
                    ul.innerHTML += '<li><span class="label">Nom</span><span class="value">' + jsonResponse.nom + '</span></li>';
                    ul.innerHTML += '<li><span class="label">Prénom</span><span class="value">' + jsonResponse.prenom + '</span></li>';
                    ul.innerHTML += '<li><span class="label">Mail</span><span class="value">' + jsonResponse.mail + '</span></li>';
                    ul.innerHTML += '<li><span class="label">Établissement</span><span class="value">' + jsonResponse.codeEtablissement + '</span></li>';
                    ul.innerHTML += '<li><span class="label">Classe</span><span class="value">' + jsonResponse.classe + '</span></li>';
                }
            }
            
            async function mettreProfilIntervenant() {
                console.log("Appel de l'Action: mettreProfilIntervenant");
                let url = './ActionServlet?todo=mettre-profil-intervenant';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                
                ajouterLogOut(document.getElementById('ul-infos'));
                var ul = document.getElementById('ul-infos');
                ul.innerHTML = '<li><span class="label">Login</span><span class="value">' + jsonResponse.login + '</span></li>';
                ul.innerHTML += '<li><span class="label">Interventions terminées</span><span class="value">' + jsonResponse.nbIntervention + '</span></li>';
                ul.innerHTML += '<li><span class="label">Téléphone</span><span class="value">' + jsonResponse.telephone + '</span></li>';
                ul.innerHTML += '<li><span class="label">Niveaux</span><span class="value">' + jsonResponse.niveauMin + ' – ' + jsonResponse.niveauMax + '</span></li>';
                afficherHistorique(jsonResponse.histoDemandes, 'intervenant');
                
            }

            function afficherHistorique(demandes, role) {
                var zone = document.getElementById('historique-zone');
                if (!demandes || demandes.length === 0) {
                    zone.innerHTML = '<p class="empty-state">Aucun historique pour le moment.</p>';
                    return;
                }
                var table = document.createElement('table');
                table.className = 'data-table';
                table.innerHTML = '<thead><tr><th>Date</th><th>Matière</th><th></th></tr></thead>';
                var tbody = document.createElement('tbody');
                demandes.forEach(function (d) {
                    var tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + d.date + '</td><td>' + d.matiere + '</td>';
                    var td = document.createElement('td');
                    td.className = 'link-cell';
                    td.textContent = 'Détails';
                    td.onclick = function () {
                        window.location = 'detailsDemande.html?demande=' + d.id + '&role=' + role;
                    };
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                zone.innerHTML = '<h2 style="margin-top:1.5rem;font-size:1.1rem;color:var(--color-primary);">Historique</h2>';
                zone.appendChild(table);
            }
            
            async function logOut() {
                console.log("Appel de l'Action: log out");
                let url = './ActionServlet?todo=log-out';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse && jsonResponse.reussit == "true") {
                    console.log('logged out');
                    window.location = "./connexion.html";
                }
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Intervention — Instruct-IF</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/instruct-if.css">
    </head>
    <body>
        <div data-main>
            <h1 class="page-title">Intervention en cours</h1>
            <p class="page-subtitle">Demande de soutien assignée</p>

            <div class="toolbar">
                <button id="button-profil" class="btn btn-ghost" type="button">Profil</button>
                <a href="stats.html" class="btn btn-ghost">Statistiques</a>
                <button id="button-logOut" class="btn btn-danger" type="button">Déconnexion</button>
            </div>

            <div id="div-demande" class="card">
                <ul class="info-list" id="ul-infos"></ul>
            </div>
            <div id="div-message"></div>
        </div>

        <script src="js/layout.js"></script>
        
        <script>
            function initPage() {
                console.log("Initialisation de la page Intervention");
                renderHeader({
                    links: [
                        { href: 'profil.html?intervenant=true&eleve=false&idEleve=null', label: 'Profil' },
                        { href: 'stats.html', label: 'Statistiques' }
                    ]
                });
                mettreInfos();
                document.getElementById('button-logOut').addEventListener('click', function() {
                    console.log("Click sur le bouton 'log out'");
                    logOut();
                });
                document.getElementById('button-profil').addEventListener('click', function() {
                    console.log("Click sur le bouton 'Profil'");
                    window.location = "./profil.html" + "?intervenant=true" + "&eleve=false" + "idEleve=null";
                });
            };
            
            async function mettreInfos() {
                console.log("Appel de l'Action: mettreInfos");
                let url = './ActionServlet?todo=mettre-infosIntervention';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);

                
                let divDemande = document.getElementById("div-demande");
                let message = document.getElementById("div-message");

                if (jsonResponse && jsonResponse.dispo) {
                    divDemande.innerHTML = '<div class="empty-state">Aucune nouvelle demande pour le moment.</div>';
                    message.innerHTML = '<div class="alert alert-info">Vous êtes disponible pour une nouvelle intervention.</div>';
                }
                else {
                    let ul = document.getElementById("ul-infos");
                    ul.innerHTML = '';
                    
                    [
                        ['Matière', jsonResponse.matiere],
                        ['Thème', jsonResponse.theme],
                        ['Description', jsonResponse.description],
                        ['Lien visio', jsonResponse.lien]
                    ].forEach(function (row) {
                        var li = document.createElement('li');
                        li.innerHTML = '<span class="label">' + row[0] + '</span><span class="value">' + row[1] + '</span>';
                        ul.appendChild(li);
                    });

                    var actions = document.createElement('div');
                    actions.className = 'toolbar';
                    actions.style.marginTop = '1rem';
                    
                    let buttonEleve = document.createElement("button");
                    buttonEleve.className = 'btn btn-secondary';
                    buttonEleve.innerHTML = "Détail Eleve";
                    buttonEleve.addEventListener('click', function() {
                        console.log("Click sur le bouton 'Eleve'");
                        window.location = "./profil.html" + "?intervenant=true" + "&eleve=true" + "&idEleve=" + jsonResponse.eleveId;
                    });

                    actions.appendChild(buttonEleve);
                    divDemande.appendChild(actions);
                    
                    var form = document.createElement('div');
                    form.className = 'card';
                    form.style.marginTop = '1rem';
                    form.innerHTML = '<h2>Clôturer l\'intervention</h2>';
                    var pBilan = document.createElement('p');
                    pBilan.textContent = 'Bilan pour l\'élève :';
                    var textarea = document.createElement('textarea');
                    textarea.placeholder = 'De grands progrès, exercices de base maîtrisés.';
                    var pDuree = document.createElement('p');
                    pDuree.textContent = 'Durée (minutes) :';
                    var input = document.createElement('input');
                    input.type = 'number';
                    input.placeholder = '120';
                    var btnClore = document.createElement('button');
                    btnClore.className = 'btn btn-primary';
                    btnClore.textContent = 'Clore l\'intervention';
                    btnClore.disabled = true;
                    input.addEventListener('input', function () {
                        btnClore.disabled = !input.value;
                    });
                    btnClore.addEventListener('click', function () {
                        console.log("Click sur le bouton 'Clore'");
                        cloreDemande(input.value, textarea.value);
                    });
                    form.appendChild(pBilan);
                    form.appendChild(textarea);
                    form.appendChild(pDuree);
                    form.appendChild(input);
                    form.appendChild(btnClore);
                    divDemande.parentNode.appendChild(form);
                    
                }
            }
            
            async function logOut() {
                console.log("Appel de l'Action: log out");
                let url = './ActionServlet?todo=log-out';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse && jsonResponse.reussit == "true") {
                    console.log('logged out');
                    window.location = "./connexion.html";
                }
            }
            
            async function cloreDemande(duree, bilan) {
                console.log("Appel de l'Action: clore demande");
                let url = './ActionServlet?todo=clore-demande' + "&duree=" + duree + "&bilan=" + bilan;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                window.location.reload();
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>

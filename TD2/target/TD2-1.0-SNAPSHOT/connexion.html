<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Connexion — Instruct-IF</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/instruct-if.css">
    </head>
    <body>
        <div data-main>
            <h1 class="page-title">Se connecter</h1>
            <p class="page-subtitle">Choisissez votre espace</p>

            <div class="card-grid card-grid-2">
                <section class="card">
                    <h2>Élève</h2>
                    <div class="form-group">
                        <label for="input-mail-eleve">Adresse e-mail</label>
                        <input id="input-mail-eleve" type="email" value="Albert.Einstein@insa-lyon.fr" placeholder="ton.mail@mail.com">
                    </div>
                    <div class="form-group">
                        <label for="input-password-eleve">Mot de passe</label>
                        <input id="input-password-eleve" value="y" type="password">
                    </div>
                    <button id="bouton-connexion-eleve" class="btn btn-primary" type="button">Connexion</button>
                    <button id="bouton-inscription-eleve" class="btn btn-ghost" type="button" style="margin-left:0.5rem;">Inscription</button>
                </section>

                <section class="card">
                    <h2>Intervenant</h2>
                    <div class="form-group">
                        <label for="input-login-intervenant">Identifiant</label>
                        <input id="input-login-intervenant" type="text" value="sfavro" placeholder="login">
                    </div>
                    <div class="form-group">
                        <label for="input-password-intervenant">Mot de passe</label>
                        <input id="input-password-intervenant" value="mdp" type="password">
                    </div>
                    <button id="bouton-connexion-intervenant" class="btn btn-primary" type="button">Connexion</button>
                </section>
            </div>

            <div id="div-error-affichage"></div>
        </div>

        <script src="js/layout.js"></script>
        <script>
            function initPage() {
                renderHeader({
                    links: [{ href: 'index.html', label: 'Accueil' }, { href: 'inscription.html', label: 'Inscription' }]
                });
                console.log("Initialisation de la page Connexion");
                document.getElementById('bouton-connexion-eleve').addEventListener('click', function() {
                    console.log("Click sur le bouton 'Connexion Eleve'");
                    connexionEleve();
                });
                document.getElementById('bouton-connexion-intervenant').addEventListener('click', function() {
                    console.log("Click sur le bouton 'Connexion Intervennant'");
                    connexionIntervenant();
                });
                document.getElementById('bouton-inscription-eleve').addEventListener('click', function() {
                    console.log("Click sur le bouton 'Inscription Eleve'");
                    window.location = './inscription.html';
                });
            };
            
            async function connexionEleve() {
                console.log("Appel de l'Action: Connexion");
                let url = './ActionServlet?todo=eleve-connexion' + "&" + "mail=" + document.getElementById('input-mail-eleve').value + "&" + "password=" + document.getElementById('input-password-eleve').value;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                if (jsonResponse && jsonResponse.reussit == "true") {
                    window.location = './nouvelleDemande.html';
                }
                else if (jsonResponse && jsonResponse.reussit == "false") {
                    notConnected();
                }
            }
            
            async function connexionIntervenant() {
                console.log("Appel de l'Action: Connexion");
                let url = './ActionServlet?todo=intervenant-connexion' + "&" + "login=" + document.getElementById('input-login-intervenant').value + "&" + "password=" + document.getElementById('input-password-intervenant').value;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                if (jsonResponse && jsonResponse.reussit == "true") {
                    window.location = './intervention.html';
                }
                else if (jsonResponse && jsonResponse.reussit == "false") {
                    notConnected();
                }
            }
            
            function notConnected() {
                var divError = document.getElementById("div-error-affichage");
                divError.innerHTML = '<div class="alert alert-error">Mot de passe ou identifiant incorrects.<br>Assurez-vous de vous connecter du bon côté (élève / intervenant).</div>';
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>

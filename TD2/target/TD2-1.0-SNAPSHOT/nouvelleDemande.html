<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Nouvelle demande — Instruct-IF</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/instruct-if.css">
    </head>
    <body>
        <div data-main>
            <h1 class="page-title">Nouvelle demande</h1>
            <p class="page-subtitle">Sélectionnez une matière et un thème</p>

            <div class="toolbar">
                <button id="button-profil" class="btn btn-ghost" type="button">Mon profil</button>
                <button id="button-logOut" class="btn btn-danger" type="button">Déconnexion</button>
            </div>

            <section class="card">
                <div class="form-group">
                    <label for="select-matiere">Matière</label>
                    <select name="matieres" id="select-matiere" onchange="mettreThemes()">
                        <option value="">--Veuillez choisir une option--</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="select-theme">Thème</label>
                    <select name="themes" id="select-theme" onchange="updateMatiereValue()">
                        <option value="">--Veuillez choisir une option--</option>
                    </select>
                </div>
                <button id="button-creerDemande" class="btn btn-primary" type="button" onclick="creerDemande()">Continuer</button>
                <div id="div-erreur"></div>
            </section>
        </div>

        <script src="js/layout.js"></script>
        
        <script>
            function initPage() {
                console.log("Initialisation de la page nouvelle Demande");
                renderHeader({
                    links: [
                        { href: 'profil.html?intervenant=false&eleve=true&idEleve=null', label: 'Profil' },
                        { onclick: logOut, label: 'Déconnexion' }
                    ]
                });
                document.getElementById('button-profil').addEventListener('click', function() {
                    console.log("Click sur le bouton 'Profil'");
                    window.location = "./profil.html" + "?intervenant=false" + "&eleve=true" + "&idEleve=null";
                });
                document.getElementById('button-logOut').addEventListener('click', function() {
                    console.log("Click sur le bouton 'log out'");
                    logOut();
                });
                mettreMatieres();
                mettreThemes();
            };
            
            async function logOut() {
                console.log("Appel de l'Action: log out");
                let url = './ActionServlet?todo=log-out';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse && jsonResponse.reussit == "true") {
                    console.log('logged out');
                    window.location = "./connexion.html";
                }
            }
            
            async function mettreMatieres() {
                console.log("Appel de l'Action: Lister les matieres");
                let url = './ActionServlet?todo=lister-matieres';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse) {
                    console.log('Affichage de la liste de matieres');
                    var select = document.getElementById("select-matiere");
                    select.innerHTML = '<option value="">--Veuillez choisir une option--</option>';
                    jsonResponse["matieres"].forEach(function (m) {
                        var option = document.createElement("option");
                        option.textContent = m["nom"];
                        option.value = m["id"];
                        select.appendChild(option);
                    });
                }
            }
            
            async function mettreThemes() {
                console.log("Appel de l'Action: Lister les thèmes");
                let url = './ActionServlet?todo=lister-themes'+ "&matiere=" + document.getElementById('select-matiere').value;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse) {
                    console.log('Affichage de la liste de thèmes');
                    var select = document.getElementById("select-theme");
                    select.innerHTML = '<option value="">--Veuillez choisir une option--</option>';
                    jsonResponse["themes"].forEach(function (t) {
                        var option = document.createElement("option");
                        option.innerHTML = t["nom"];
                        option.value = t["id"];
                        select.appendChild(option);
                    });
                }
            }
            
            async function updateMatiereValue() {
                console.log("Appel de l'Action: Mettre a jour la matiere");
                let url = './ActionServlet?todo=update-matiere' + '&theme=' + document.getElementById('select-theme').value;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse) {
                    console.log('Affichage de la nouvelle matiere');
                    var select = document.getElementById("select-matiere");
                    select.value = jsonResponse["matiere"];
                }
            }
            
            function creerDemande() {
                var theme = document.getElementById("select-theme").value;
                var erreurDiv = document.getElementById("div-erreur");
                if (theme == "") {
                    erreurDiv.innerHTML = '<div class="alert alert-warning">Choisissez un thème avant de continuer.</div>';
                }
                else {
                    window.location = './descriptionNouvelleDemande.html?theme=' + theme;
                }
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>

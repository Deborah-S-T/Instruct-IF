<!DOCTYPE html>
<html>
    <head>
        <title>nouvelle Demande</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Nouvelle Demande</h1>
        <div>
            <p>matieres</p>
            <select name="matieres" id="select-matiere" onchange="mettreThemes()">
                <option value="">--Veuillez choisir une option--</option>
            </select>
        </div>
        <div>
            <p>themes</p>
            <select name="themes" id="select-theme">
                <option value="">--Veuillez choisir une option--</option>
            </select>
        </div>
        
        <script>
            function initPage() {
                console.log("Initialisation de la page nouvelle Demande");
                mettreMatieres();
                mettreThemes();
            };
            
            async function mettreMatieres() {
                console.log("Appel de l'Action: Lister les matieres");
                let url = './ActionServlet?todo=lister-matieres';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse) {
                    console.log('Affichage de la liste de matieres');
                    var select = document.getElementById("select-matiere");
                    select.innerHTML = '<option value="">--Veuillez choisir une option--</option>';
                    for (let m of jsonResponse["matieres"]) {
                        var option = document.createElement("option");
                        option.innerHTML = m["nom"];
                        option.value = m["id"];
                        select.appendChild(option);
                    }
                }
            }
            
            async function mettreThemes() {
                console.log("Appel de l'Action: Lister les thèmes");
                let url = './ActionServlet?todo=lister-themes'+ "&matiere=" + document.getElementById('select-matiere').value;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse) {
                    console.log('Affichage de la liste de thèmes');
                    var select = document.getElementById("select-theme");
                    select.innerHTML = '<option value="">--Veuillez choisir une option--</option>';
                    for (let t of jsonResponse["themes"]) {
                        var option = document.createElement("option");
                        option.innerHTML = t["nom"];
                        option.value = t["id"];
                        select.appendChild(option);
                    }
                }
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Nouvelle Demande</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Description demande</h1>
        <ol id="ol-infos">
            <li id="li-matiere">Matière : </li>
            <li id="li-theme">Thème : </li>
            <li id="li-description">Description : 
                <textarea id="textarea-description" placeholder="je n'ai pas compris l'ordre seigneurial"></textarea>
            </li>
        </ol>
        <button id='button-valider'>Valider la demande</button>
 
        <script>
            function initPage() {
                console.log("Initialisation de la page Nouvelle demande");
                
                const params = new URLSearchParams(window.location.search); 
                let theme = params.get("theme");
                
                recupThemeMatiere(theme);
                document.getElementById('button-valider').addEventListener('click', function() {
                    console.log("Click sur le bouton 'Valider demande'");
                    creerDemande(theme);
                });
            };
            
            async function recupThemeMatiere(theme) {
                console.log("Appel de l'Action: recupThemeMatiere");
                
                let url = './ActionServlet?todo=recup-theme-matiere' + "&theme=" + theme;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                if (jsonResponse) {
                    let matiere = document.getElementById("li-matiere");
                    let theme = document.getElementById("li-theme");

                    matiere.innerHTML += jsonResponse["matiereNom"];
                    theme.innerHTML += jsonResponse["themeNom"];
                }
            }
            
            async function creerDemande(theme) {
                console.log("Appel de l'Action: creer Demande");
                let url = './ActionServlet?todo=creer-demande'+ "&theme=" + theme + "&description=" + document.getElementById("textarea-description").value;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                if (jsonResponse.reussit == "true") {
                    window.location = './etatDemande.html';
                }
                else if (jsonResponse.reussit == "false") {
                    notConnected();
                }
            }
            window.onload = initPage;
        </script>
    </body>
</html>

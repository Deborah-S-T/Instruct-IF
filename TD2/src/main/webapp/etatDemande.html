<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>État de la demande — Instruct-IF</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/instruct-if.css">
    </head>
    <body>
        <div data-main>
            <h1 class="page-title">État de la demande</h1>

            <section class="card">
                <ul class="info-list">
                    <li><span class="label">Matière</span><span class="value" id="li-matiere">—</span></li>
                    <li><span class="label">Thème</span><span class="value" id="li-theme">—</span></li>
                    <li><span class="label">Description</span><span class="value" id="li-description">—</span></li>
                </ul>
                <div id="div-message"></div>
            </section>

            <div class="toolbar">
                <a href="nouvelleDemande.html" class="btn btn-secondary">Nouvelle demande</a>
                <button id="button-logOut" class="btn btn-ghost" type="button">Déconnexion</button>
            </div>
        </div>

        <script src="js/layout.js"></script>
        
        <script>
            function initPage() {
                console.log("Initialisation de la page Nouvelle demande");
                
                renderHeader({ links: [{ href: 'profil.html?intervenant=false&eleve=true&idEleve=null', label: 'Profil' }] });

                document.getElementById('button-logOut').addEventListener('click', function() {
                    console.log("Click sur le bouton 'log out'");
                    logOut();
                });
                
                const params = new URLSearchParams(window.location.search); 
                let demandeCree = params.get("reussit");
                let theme = params.get("theme");
                let description = params.get("description");
                let idDemande = params.get("idDemande");
                let lienDemande = params.get("lienDemande");
                
                afficherEtatDemande(demandeCree, theme, description, idDemande, lienDemande);
            };
            
            async function logOut() {
                console.log("Appel de l'Action: log out");
                let url = './ActionServlet?todo=log-out';
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log(jsonResponse);
                if (jsonResponse.reussit == "true") {
                    console.log('logged out');
                    window.location = "./connexion.html";
                }
            }
            
            async function afficherEtatDemande(demandeCree, theme, description, idDemande, lienDemande) {
                console.log("Appel de l'Action: afficherEtatDemande");
                
                let url = './ActionServlet?todo=recup-theme-matiere' + "&demandeCree"+ demandeCree + "&theme=" + theme;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                if (jsonResponse) {
                    let matiere = document.getElementById("li-matiere");
                    let theme = document.getElementById("li-theme");
                    let liDescription = document.getElementById("li-description");

                    matiere.textContent = jsonResponse["matiereNom"];
                    theme.textContent = jsonResponse["themeNom"];
                    liDescription.textContent = description;
                    
                    let message = document.getElementById("div-message");
                    if (demandeCree == "true") {
                        message.innerHTML = '<div class="alert alert-success">Un intervenant a été trouvé.<br>RDV sur ce lien : <a href="' + lienDemande + '" target="_blank">' + lienDemande + '</a></div>';
                    }
                    else if (demandeCree == "false") {
                        message.innerHTML = '<div class="alert alert-warning">Désolé, pas d\'intervenant disponible… Réessayez plus tard.</div>';
                    }
                }
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>

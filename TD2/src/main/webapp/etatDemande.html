<!DOCTYPE html>
<html>
    <head>
        <title>Nouvelle Demande</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Etat demande</h1>
        <a href="nouvelleDemande.html">nouvelle demande</a>
        <a href="profil.html">profil</a>
        <ul id="ol-infos">
            <li id="li-matiere">Matière : </li>
            <li id="li-theme">Thème : </li>
            <li id="li-description">Description : </li>
        </ul>
        <div id='div-message'></div>
        
        <script>
            function initPage() {
                console.log("Initialisation de la page Nouvelle demande");
                
                const params = new URLSearchParams(window.location.search); 
                let demandeCree = params.get("reussit");
                let theme = params.get("theme");
                let description = params.get("description");
                let idDemande = params.get("idDemande");
                let lienDemande = params.get("lienDemande");
                
                afficherEtatDemande(demandeCree, theme, description, idDemande, lienDemande);
            };
            
            async function afficherEtatDemande(demandeCree, theme, description, idDemande, lienDemande) {
                console.log("Appel de l'Action: afficherEtatDemande");
                
                let url = './ActionServlet?todo=recup-theme-matiere' + "&demandeCree"+ demandeCree + "&theme=" + theme;
                let jsonResponse = await fetch(url)
                        .then(
                            function(httpResponse) {
                                return httpResponse.json();
                            }
                        )
                        .catch(
                            function(error) {
                                console.log(error);
                                return null;
                            }
                        );
                console.log("json:",jsonResponse);
                if (jsonResponse) {
                    let matiere = document.getElementById("li-matiere");
                    let theme = document.getElementById("li-theme");
                    let liDescription = document.getElementById("li-description");

                    matiere.innerHTML += jsonResponse["matiereNom"];
                    theme.innerHTML += jsonResponse["themeNom"];
                    liDescription.innerHTML += description;
                    
                    let message = document.getElementById("div-message");
                    if (demandeCree == "true") {
                        message.innerHTML = "Un intervenant a été trouvé <br> -> RDV sur ce lien <br>" + lienDemande;
                    }
                    else if (demandeCree == "false") {
                        message.innerHTML = "Désolé, pas d'intervenant disponible... Réessayez plus tard !";
                    }
                }
            }
            
            window.onload = initPage;
        </script>
    </body>
</html>
